# 此文件会被 COPY 为 nginx 官方镜像的 /etc/nginx/templates/default.conf.template，
# 容器启动时 entrypoint 用 envsubst 把 ${INGEST_TOKEN} 替换为环境变量值后生成
# /etc/nginx/conf.d/default.conf。nginx 自身变量（$host/$uri 等）不是环境变量，不受影响。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端 SPA：找不到文件回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 分析触发接口（方案A）：由 nginx 服务端注入 X-Ingest-Token。
    # token 来自前端容器环境变量 INGEST_TOKEN（源头 deploy/.env），浏览器全程不可见；
    # 精确匹配只注入这一个端点，不给其它 /api 路径附带凭证。
    location = /api/analysis/run {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Ingest-Token "${INGEST_TOKEN}";
        proxy_read_timeout 180s;   # 分析需等待模型生成（通常 30~90s）
    }

    # 反代后端 API，浏览器同源访问，避免跨域。
    # host.docker.internal 经 compose 的 extra_hosts 指向宿主机，
    # 命中宿主机已发布的后端 8000 端口（无需对公网开放 8000）。
    # 若你的环境解析不了 host.docker.internal，把下面改成 http://172.17.0.1:8000
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
